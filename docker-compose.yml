services:
  mongo:
    image: mongo:7
    container_name: doomsday-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: doomsday-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_URI: mongodb://mongo:27017/doomsday-ready
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: doomsday-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend

volumes:
  mongo-data:
